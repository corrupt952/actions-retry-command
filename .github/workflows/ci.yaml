name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Verify Package Signatures
        id: npm-audit-signatures
        run: npm audit signatures

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test basic command
        id: test-basic
        uses: ./
        with:
          command: echo "hello"

      - name: Verify basic output
        env:
          RESULT: ${{ steps.test-basic.outputs.result }}
          EXIT_CODE: ${{ steps.test-basic.outputs.exit_code }}
        run: |
          [ "$RESULT" = "hello" ] || exit 1
          [ "$EXIT_CODE" = "0" ] || exit 1

      - name: Test failure with retry
        id: test-failure
        continue-on-error: true
        uses: ./
        with:
          command: exit 1
          max_attempts: 2
          retry_interval: 0

      - name: Verify failure output
        env:
          EXIT_CODE: ${{ steps.test-failure.outputs.exit_code }}
          OUTCOME: ${{ steps.test-failure.outcome }}
        run: |
          [ "$EXIT_CODE" = "1" ] || exit 1
          [ "$OUTCOME" = "failure" ] || exit 1

      - name: Test multiline output
        id: test-multiline
        uses: ./
        with:
          command: printf 'hello\nworld\ngithub'

      - name: Verify multiline output
        env:
          RESULT: ${{ steps.test-multiline.outputs.result }}
        run: |
          expected=$(printf 'hello\nworld\ngithub')
          [ "$RESULT" = "$expected" ] || exit 1

      - name: Test specific exit code
        id: test-exit-code
        continue-on-error: true
        uses: ./
        with:
          command: exit 255
          max_attempts: 1

      - name: Verify exit code preserved
        env:
          EXIT_CODE: ${{ steps.test-exit-code.outputs.exit_code }}
        run: |
          [ "$EXIT_CODE" = "255" ] || exit 1

      - name: Test retry then succeed
        id: test-retry-succeed
        uses: ./
        with:
          command: |
            if [ -f /tmp/retry_marker_test ]; then echo "success"; exit 0; fi
            touch /tmp/retry_marker_test; echo "fail"; exit 1
          max_attempts: 3
          retry_interval: 0

      - name: Verify retry succeeded
        env:
          EXIT_CODE: ${{ steps.test-retry-succeed.outputs.exit_code }}
        run: |
          [ "$EXIT_CODE" = "0" ] || exit 1

      - name: Test shell selection
        id: test-shell
        uses: ./
        with:
          command: echo "from sh"
          shell: sh

      - name: Verify shell selection
        env:
          RESULT: ${{ steps.test-shell.outputs.result }}
        run: |
          [ "$RESULT" = "from sh" ] || exit 1

      - name: Test timeout
        id: test-timeout
        continue-on-error: true
        uses: ./
        with:
          command: sleep 60
          timeout: 1
          max_attempts: 1

      - name: Verify timeout
        env:
          EXIT_CODE: ${{ steps.test-timeout.outputs.exit_code }}
          OUTCOME: ${{ steps.test-timeout.outcome }}
        run: |
          [ "$EXIT_CODE" = "124" ] || exit 1
          [ "$OUTCOME" = "failure" ] || exit 1

      - name: Test retry_on_exit_code
        id: test-retry-on-code
        continue-on-error: true
        uses: ./
        with:
          command: exit 42
          retry_on_exit_code: '1,2'
          max_attempts: 3
          retry_interval: 0

      - name: Verify retry_on_exit_code
        env:
          EXIT_CODE: ${{ steps.test-retry-on-code.outputs.exit_code }}
        run: |
          [ "$EXIT_CODE" = "42" ] || exit 1

      - name: Test working directory
        id: test-working-dir
        uses: ./
        with:
          command: pwd -P
          working_directory: /tmp

      - name: Verify working directory
        env:
          RESULT: ${{ steps.test-working-dir.outputs.result }}
        run: |
          expected=$(cd /tmp && pwd -P)
          [ "$RESULT" = "$expected" ] || exit 1

  check-dist:
    name: Check dist/
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Build dist/ Directory
        id: build
        run: npm run package

      - name: Compare Directories
        id: diff
        run: |
          if [ ! -d dist/ ]; then
            echo "Expected dist/ directory does not exist."
            ls -la ./
            exit 1
          fi
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff --ignore-space-at-eol --text dist/
            exit 1
          fi

      - if: ${{ failure() && steps.diff.outcome == 'failure' }}
        name: Upload Artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
